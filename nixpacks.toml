

[phases.setup]
# Install the checksum-pinned upstream security release before dependencies.
aptPkgs = ["...", "ca-certificates", "curl", "xz-utils"]
paths = ["/opt/node-security/bin", "..."]
cmds = ["...", "set -eu; curl -fsSL --retry 3 https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz -o /tmp/node-security.tar.xz; echo \"6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6  /tmp/node-security.tar.xz\" | sha256sum -c -; mkdir -p /opt/node-security; tar -xJf /tmp/node-security.tar.xz --strip-components=1 -C /opt/node-security; test \"$(/opt/node-security/bin/node --version)\" = \"v24.22.1\""]
